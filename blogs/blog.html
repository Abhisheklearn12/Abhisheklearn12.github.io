<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogs - Abhishek</title>

    <link rel="icon" type="image/jpeg" href="../assets/avatar.jpg" />

    <!-- Google Analytics (GA4) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-H7XW85DBKF"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-H7XW85DBKF");
    </script>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@1.17.0"></script>

    <style>
      /* Reading font (serif) across the whole page: nav + list */
      body {
        font-family: "Times New Roman", Times, serif;
      }
      /* Keep the top nav in the default sans-serif */
      nav {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      html.dark body {
        background-color: #0a0a0a;
      }
      html.dark .text-gray-900,
      html.dark .text-gray-800,
      html.dark .text-gray-700 {
        color: #ededed;
      }
      html.dark .text-gray-600,
      html.dark .text-gray-500 {
        color: #a1a1aa;
      }
      html.dark .border-gray-200,
      html.dark .border-gray-300 {
        border-color: #262626;
      }
      .theme-icon-moon {
        display: none;
      }
      html.dark .theme-icon-sun {
        display: none;
      }
      html.dark .theme-icon-moon {
        display: inline-flex;
      }
    </style>
  </head>

  <body
    class="bg-white text-gray-900 w-full max-w-3xl mx-auto px-5 sm:px-6 md:px-0 pb-16"
  >
    <!-- Nav -->
    <nav
      class="flex justify-between items-center gap-3 py-6 border-b border-gray-200"
    >
      <a href="../index.html" class="shrink-0">
        <img
          src="../assets/avatar.jpg"
          alt="Abhishek"
          class="w-10 h-10 sm:w-11 sm:h-11 rounded-lg object-cover"
        />
      </a>
      <div class="flex gap-4 sm:gap-6 text-sm items-center">
        <a href="../index.html" class="hover:text-orange-600 transition">Home</a>
        <a href="./blog.html" class="hover:text-orange-600 transition">Blogs</a>
        <a
          href="../projects/projects.html"
          class="hover:text-orange-600 transition"
          >Projects</a
        >
        <a href="../books/books.html" class="hover:text-orange-600 transition"
          >Books</a
        >
        <button
          id="theme-toggle"
          aria-label="Switch white / black theme"
          title="Switch white / black theme"
          class="w-9 h-9 flex items-center justify-center rounded-full border border-gray-300 hover:text-orange-600 transition shrink-0"
        >
          <span class="theme-icon-sun"><i data-lucide="sun" class="w-4 h-4"></i></span>
          <span class="theme-icon-moon"><i data-lucide="moon" class="w-4 h-4"></i></span>
        </button>
      </div>
    </nav>

    <!-- Blog List -->
    <section class="mt-10">
      <h2 class="text-xl sm:text-2xl font-semibold mb-6">Blog Posts</h2>

      <ul class="list-none space-y-4">
        <a href="./memory.html" class="block">
          <li
            class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-0 hover:underline underline-offset-4 py-2"
          >
            <span class="text-gray-500 sm:w-40 shrink-0 text-sm sm:text-base"
              >June 4, 2026</span
            >
            <span class="flex-1 font-mono text-base sm:text-lg"
              >A Visual Guide to How Memory Really Works</span
            >
          </li>
        </a>
        <a href="./parallelism.html" class="block">
          <li
            class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-0 hover:underline underline-offset-4 py-2"
          >
            <span class="text-gray-500 sm:w-40 shrink-0 text-sm sm:text-base"
              >May 27, 2026</span
            >
            <span class="flex-1 font-mono text-base sm:text-lg"
              >Parallelism: hardware doesn't create parallelism</span
            >
          </li>
        </a>
      </ul>
    </section>

    <script>
      document.getElementById("theme-toggle").addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
      });
      lucide.createIcons();
    </script>
  </body>
</html>
